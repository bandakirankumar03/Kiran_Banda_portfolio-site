<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kiran Banda — Environment Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --ink: #f2ede3;
    --dim: rgba(242,237,227,0.55);
    --dimmer: rgba(242,237,227,0.28);
    --hair: rgba(242,237,227,0.12);
    --accent: #73c2fb;
    --pad: clamp(20px, 5vw, 48px);
    --online: #3ddc84;
    --online-glow: rgba(61, 220, 132, 0.55);
    --serif: "Lora", Georgia, serif;
    --sans:  "Lora", Georgia, serif;
    --mono:  "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  img, video, iframe { max-width: 100%; }
  @media (max-width: 680px) { .home-deco { display: none !important; } }
  @media (max-width: 1024px) and (min-width: 681px) { .home-deco { transform: scale(0.65); transform-origin: bottom right; } }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); }
  body { overflow-x: hidden; cursor: none; }
  @media (max-width: 900px) { body { cursor: auto; } .cursor { display: none !important; } }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  html { scroll-behavior: smooth; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 4px; }

  /* online indicator — green pulse, like a live status light */
  .online-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--online); margin-right: 8px; vertical-align: 1px;
    box-shadow: 0 0 0 0 var(--online-glow), 0 0 12px var(--online-glow);
    animation: onlinePulse 1.8s ease-out infinite;
  }
  .online-dot.small { width: 7px; height: 7px; }
  .online-text { color: var(--online); }
  @keyframes onlinePulse {
    0%   { box-shadow: 0 0 0 0 var(--online-glow),    0 0 10px var(--online-glow); }
    70%  { box-shadow: 0 0 0 10px rgba(61,220,132,0), 0 0 14px var(--online-glow); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,132,0),    0 0 10px var(--online-glow); }
  }
</style>
</head>
<body>
  <form name="contact" data-netlify="true" hidden><input name="name" /><input name="email" /><textarea name="project"></textarea></form>
<div id="root"></div>
