<style>
  :root {
    --bg: #08070B;
    --ink: #F5F3FF;
    --dim: rgba(245,243,255,0.72);
    --dimmer: rgba(245,243,255,0.46);
    --hair: rgba(245,243,255,0.20);
    --accent: #4E50DE;
    --lab-primary: #F32E35;
    --lab-ink: #F5F3FF;
    --lab-muted: rgba(245,243,255,.78);
    --lab-accent: #4E50DE;
    --lab-cover-primary: #F32E35;
    --lab-logo-filter: brightness(0) invert(1);
    --pad: clamp(20px, 5vw, 48px);
    --online: #3ddc84;
    --online-glow: rgba(61, 220, 132, 0.55);
    --serif: "Lora", Georgia, serif;
    --sans:  "Lora", Georgia, serif;
    --mono:  "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  img, video, iframe { max-width: 100%; }
  @media (max-width: 680px) { .home-deco { display: none !important; } }
  @media (max-width: 1024px) and (min-width: 681px) { .home-deco { transform: scale(0.65); transform-origin: bottom right; } }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); }
  body { overflow-x: hidden; cursor: none; }
  @media (max-width: 900px) { body { cursor: auto; } .cursor { display: none !important; } }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  html { scroll-behavior: smooth; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 4px; }

  /* online indicator — green pulse, like a live status light */
  .online-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--online); margin-right: 8px; vertical-align: 1px;
    box-shadow: 0 0 0 0 var(--online-glow), 0 0 12px var(--online-glow);
    animation: onlinePulse 1.8s ease-out infinite;
  }
  .online-dot.small { width: 7px; height: 7px; }
  .online-text { color: var(--online); }
  @keyframes onlinePulse {
    0%   { box-shadow: 0 0 0 0 var(--online-glow),    0 0 10px var(--online-glow); }
    70%  { box-shadow: 0 0 0 10px rgba(61,220,132,0), 0 0 14px var(--online-glow); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,132,0),    0 0 10px var(--online-glow); }
  }
/* Published Black / Neon / Indigo theme. */
  html .xr-editorial, html .project-cover { --accent:var(--lab-accent); }
  html .site-nav { background:color-mix(in srgb,var(--bg) 94%,transparent)!important; border-color:var(--hair)!important; box-shadow:none!important; }
  html .site-nav img { filter:var(--lab-logo-filter)!important; }
  /* A lighter indigo tint keeps small interactive text legible on black. */
  html:not([data-style-lab]) .pc-role, html:not([data-style-lab]) .pc-top span,
  html:not([data-style-lab]) .nyc-eyebrow, html:not([data-style-lab]) .nyc-brief dt,
  html:not([data-style-lab]) .nyc-action, html:not([data-style-lab]) .nyc-steps b { color:#9698FF; }
        .xr-image-dialog { position:fixed; inset:0; margin:0; padding:0; border:0; border-radius:0; background:transparent; width:100vw; height:100dvh; max-width:none; max-height:none; overflow:hidden; cursor:default!important; }
        .xr-image-dialog::backdrop { background:rgba(0,0,0,.92); }
        .xr-image-canvas { width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none; cursor:zoom-in!important; }
        .xr-image-canvas[data-zoomed=true] { cursor:grab!important; }
        .xr-image-canvas[data-dragging=true] { cursor:grabbing!important; }
        .xr-image-canvas img { display:block; max-width:94vw; max-height:90dvh; width:auto; height:auto; object-fit:contain; user-select:none; pointer-events:none; transform-origin:center; }
        .xr-image-close { position:absolute; z-index:2; top:16px; right:16px; width:44px; height:44px; display:grid; place-items:center; padding:0; border:0; background:rgba(0,0,0,.35); border-radius:50%; color:#fff; cursor:pointer!important; }
        .xr-image-close svg { pointer-events:none; }
        .xr-image-close:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
