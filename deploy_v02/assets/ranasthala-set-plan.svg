<text x="450" y="568" text-anchor="middle" class="label gold">CURVED LED WALL</text><path class="line" d="M450 548v-24"/>
<path class="line" d="M580 254 640 213h81"/><text x="650" y="202" class="label">ACTIVE STAGE</text>
</g>
<g data-layer="set"><rect x="389" y="285" width="122" height="144" fill="#e2bc62" fill-opacity=".12" stroke="#e2bc62"/><rect x="382" y="278" width="136" height="158" fill="none" stroke="#e2bc62" stroke-opacity=".28" stroke-width="7"/>
<g fill="#e2bc62" fill-opacity=".2" stroke="#e2bc62" stroke-opacity=".65"><path d="m402 303 10-8 13 6-4 11-15 4-7-5Z"/><path d="m480 302 11 3 4 12-9 8-12-5-2-9Z"/><path d="m406 396 10-8 12 7 3 12-13 6-13-5Z"/><path d="m479 397 12-6 8 11-6 12-13-2Z"/><path d="m449 375 9-5 8 8-4 9-11-1Z"/><path d="m481 359 10-3 5 8-6 8-9-3Z"/></g>
