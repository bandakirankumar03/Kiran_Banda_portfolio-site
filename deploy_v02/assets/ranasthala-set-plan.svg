<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">Ranasthala production floor plan</title><desc id="desc">A diagrammatic redraw of the supplied set plan. Camera and equipment face a curved LED wall. The practical set includes a five by seven foot sand pit with five hundred pounds of sand and five to six foam and painted rocks. Five foot side and three foot front distances are retained. Not to scale.</desc>
