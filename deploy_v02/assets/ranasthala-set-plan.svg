<style>text{font-family:Arial,sans-serif;fill:#eeeade} .label{font-size:15px;letter-spacing:1px}.note{font-size:12px;fill:#a4a79c}.gold{fill:#e2bc62}.line{stroke:#e2bc62;stroke-width:1.3;fill:none}.guide{stroke:#e2bc62;stroke-width:1;stroke-dasharray:5 6;fill:none;opacity:.45}.caption{font-size:11px;letter-spacing:2px;fill:#a4a79c}</style>
<text x="35" y="32" class="caption">RANASTHALA / PRODUCTION FLOOR PLAN</text>
<g data-layer="camera"><rect x="100" y="78" width="235" height="54" rx="15" fill="#e2bc62" fill-opacity=".07" stroke="#e2bc62" stroke-opacity=".6"/><g class="line"><rect x="126" y="62" width="31" height="21" rx="2"/><path d="M141 83v7m-9 0h18"/><rect x="205" y="55" width="30" height="28" rx="8"/><rect x="281" y="62" width="31" height="21" rx="2"/><path d="M296 83v7m-9 0h18"/></g><text x="218" y="112" text-anchor="middle" class="label">VSFX FoH</text>
<g class="line"><rect x="435" y="157" width="30" height="31" rx="3"/><path d="m440 188 10 11 10-11m-10 11v13m-15 7h30M435 164l-16-9v23l16-8m30-6 12-8v20l-12-6"/><circle cx="424" cy="151" r="7"/><circle cx="474" cy="151" r="7"/></g>
<path class="line" d="M481 165 570 109h50"/><text x="632" y="105" class="label">CAMERA / EQUIPMENT</text><text x="632" y="126" class="note">Virtual-production stage</text>
<path class="guide" d="M450 191 325 392M450 191 575 392M450 208V518"/>
</g>
<g data-layer="stage"><rect x="130" y="240" width="640" height="274" fill="url(#grid)" stroke="#d9d6c7" stroke-opacity=".35"/><rect x="320" y="240" width="260" height="238" fill="#e2bc62" fill-opacity=".05" stroke="#e2bc62" stroke-opacity=".55"/>
